# Déploiement continu : construit le logiciel Windows et son installateur.
#   - pousser un tag vX.Y.Z publie une GitHub Release avec NewtonFractals-Setup-X.Y.Z.exe
#     (installateur, sans Python) et une archive .zip (sources Python + moteur compilé) ;
#   - sur une pull request qui touche le code ou l'empaquetage, et à la main (workflow_dispatch),
#     tout est construit et testé, sans rien publier (installateur disponible en artefact).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "ConsoleApplication2/**"
      - "packaging/**"
      - "docs/manuel/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp

      # (les DLL de MinGW, dont OpenMP, sont livrées avec le moteur : rien à installer côté C++)
      - name: Compiler le moteur C++ et joindre ses DLL
        shell: msys2 {0}
        working-directory: ConsoleApplication2
        run: |
          g++ -std=c++14 -O2 -fopenmp -o main.exe main.cpp Tableau.cpp CNum.cpp
          for dll in $(ldd main.exe | awk '/ucrt64/ {print $3}'); do cp "$dll" .; done
          ls -l main.exe *.dll

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances et les outils d'empaquetage
        run: |
          python -m pip install -r requirements.txt pytest pyinstaller
          choco install innosetup -y --no-progress

      - name: Vérifier le moteur
        env:
          MAIN_EXE: ${{ github.workspace }}\ConsoleApplication2\main.exe
        run: python -m pytest tests/test_moteur.py -v

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path ConsoleApplication2\NewtonFractalsDrawing.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à VERSION = $version (NewtonFractalsDrawing.py)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Construire le logiciel et l'installateur
        run: python packaging/construire.py --moteur ConsoleApplication2\main.exe

      # Test de bout en bout de ce que reçoit l'utilisateur : installation silencieuse,
      # lancement de l'exe installé (calculs du moteur compris), puis désinstallation.
      - name: Installer, lancer et désinstaller
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = "dist\NewtonFractals-Setup-${{ steps.version.outputs.version }}.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=installation.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content installation.log; throw "Installation : code $($p.ExitCode)" }

          $dossier = Join-Path $env:LOCALAPPDATA "Programs\Newton Fractals"
          foreach ($f in "NewtonFractals.exe", "moteur\moteur.exe", "manuel\index.html", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dossier $f))) { throw "Fichier manquant après installation : $f" }
          }

          # Mise à jour par-dessus l'installation : les fichiers de l'ancienne version disparaissent
          $ancien = Join-Path $dossier "_internal\fichier_ancienne_version.txt"
          Set-Content $ancien "ancien"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Mise à jour : code $($p.ExitCode)" }
          if (Test-Path $ancien) { throw "Mise à jour : un fichier de l'ancienne version est resté dans _internal" }

          $rapport = Join-Path $env:RUNNER_TEMP "rapport.json"
          $p = Start-Process (Join-Path $dossier "NewtonFractals.exe") -ArgumentList "--auto-test", "`"$rapport`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "L'application ne s'est pas terminée en 5 minutes" }
          if (Test-Path $rapport) { Get-Content $rapport } else { throw "Pas de rapport : l'application n'a pas démarré (code $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "Auto-test en échec (code $($p.ExitCode))" }

          $p = Start-Process (Join-Path $dossier "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          # (le désinstalleur se relance depuis un dossier temporaire : on attend qu'il ait fini)
          $cle = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8C1F3B52-6E7A-4D0B-9F43-2A5D7C9E1B60}_is1"
          $raccourcis = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Newton Fractals*"
          for ($i = 0; $i -lt 60 -and ((Test-Path $dossier) -or (Test-Path $cle)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dossier) { Get-ChildItem -Recurse $dossier; throw "Désinstallation incomplète : le dossier reste" }
          if (Test-Path $cle) { throw "Désinstallation incomplète : l'entrée « Applications installées » reste" }
          if (Test-Path $raccourcis) { throw "Désinstallation incomplète : les raccourcis du menu Démarrer restent" }
          "Installation, lancement et désinstallation : OK"

      - name: Assembler l'archive des sources
        id: archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $dossier = "NewtonFractals-$version-windows"
          New-Item -ItemType Directory $dossier | Out-Null
          Copy-Item ConsoleApplication2\main.exe, ConsoleApplication2\*.dll, ConsoleApplication2\*.py, ConsoleApplication2\icone.png $dossier
          Copy-Item requirements.txt, README.md, packaging\QUICKSTART.txt $dossier
          Compress-Archive -Path $dossier -DestinationPath "$dossier.zip"
          "nom=$dossier" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: NewtonFractals-Setup-${{ steps.version.outputs.version }}
          path: dist/NewtonFractals-Setup-${{ steps.version.outputs.version }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.nom }}
          path: ${{ steps.archive.outputs.nom }}.zip

      - name: Publier la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/NewtonFractals-Setup-${{ steps.version.outputs.version }}.exe"
          "${{ steps.archive.outputs.nom }}.zip"
          --title "Newton Fractals ${{ github.ref_name }}" --generate-notes --verify-tag
