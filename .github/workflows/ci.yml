# Intégration continue : à chaque push sur main et à chaque pull request,
# le moteur C++ est compilé sous Linux et sous Windows (MinGW et Visual Studio),
# puis le code Python est analysé et testé.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check . --output-format github

  linux:
    name: Linux · g++ · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # (sous Python 3.10, PySide6 fait planter l'interpréteur à la sortie : « none_dealloc »)
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le moteur C++ (g++, OpenMP, avertissements stricts)
        working-directory: ConsoleApplication2
        run: g++ -std=c++14 -O2 -fopenmp -Wall -Wextra -o main main.cpp Tableau.cpp CNum.cpp

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliothèques système pour Qt hors écran
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dépendances Python
        run: python -m pip install -r requirements-dev.txt

      - name: Tests (logique, moteur C++, interface hors écran)
        env:
          MAIN_EXE: ${{ github.workspace }}/ConsoleApplication2/main
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  windows-mingw:
    name: Windows · MinGW
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      # (le gcc récent de MSYS2 ne fournit plus OpenMP en bibliothèque statique : les DLL
      # nécessaires sont copiées à côté de l'exécutable, qui tourne ainsi sans MSYS2)
      - name: Compiler le moteur C++ et joindre ses DLL
        shell: msys2 {0}
        working-directory: ConsoleApplication2
        run: |
          g++ -std=c++14 -O2 -fopenmp -Wall -Wextra -o main.exe main.cpp Tableau.cpp CNum.cpp
          for dll in $(ldd main.exe | awk '/ucrt64/ {print $3}'); do cp "$dll" .; done
          ls -l main.exe *.dll
          ./main.exe --aide

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests d'intégration du moteur
        env:
          MAIN_EXE: ${{ github.workspace }}\ConsoleApplication2\main.exe
        run: |
          python -m pip install numpy pytest
          python -m pytest tests/test_moteur.py -v

      - uses: actions/upload-artifact@v4
        with:
          name: moteur-windows
          path: |
            ConsoleApplication2/main.exe
            ConsoleApplication2/*.dll
          retention-days: 30

  windows-msvc:
    name: Windows · Visual Studio (MSBuild)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Compiler la solution (Release x64)
        run: msbuild NewtonFractals.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests d'intégration du moteur
        env:
          MAIN_EXE: ${{ github.workspace }}\x64\Release\ConsoleApplication2.exe
        run: |
          python -m pip install numpy pytest
          python -m pytest tests/test_moteur.py -v
